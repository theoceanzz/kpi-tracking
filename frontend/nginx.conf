server {
    listen 80;
    server_name localhost;

    # Mặc định của nginx là 1m, tức tệp minh chứng trên 1MB bị trả 413 NGAY TẠI ĐÂY, không bao
    # giờ chạm tới Spring — nên mọi thông điệp mà AttachmentPolicy viết ra đều vô nghĩa.
    # 55m để khớp spring.servlet.multipart.max-request-size.
    client_max_body_size 55m;

    # ── Security headers cho SPA ─────────────────────────────────────────────────────────
    # `always` để header đi kèm cả trang lỗi. HSTS KHÔNG đặt ở đây vì nginx này chỉ nghe 80;
    # lớp terminate TLS phía trước (Cloudflare / nginx ngoài) phải phát
    #   Strict-Transport-Security: max-age=31536000; includeSubDomains
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # CSP: script chỉ từ chính origin (Vite build không có inline script) — đây là lớp chặn XSS
    # chính. style cần 'unsafe-inline' vì Tailwind/Radix/Recharts ghi style attribute trực tiếp.
    # connect-src mở https:/wss: để API tách domain (api.keygo.vn) và VietQR vẫn gọi được.
    # frame-src cho Office viewer xem tệp đính kèm; img-src https: cho Cloudinary/VietQR/UrBox.
    # Nếu console báo "Refused to ..." thì nới đúng directive đó, đừng bỏ cả header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://view.officeapps.live.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Serve static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    # Using /api without trailing slash to catch all /api... requests
    location /api {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle 405 error from Nginx when POSTing to a static location
        # (Though /api should always proxy, this is a safety measure)
        error_page 405 =200 $uri;
    }

    # Proxy WebSocket connections for real-time notifications
    location /ws {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
