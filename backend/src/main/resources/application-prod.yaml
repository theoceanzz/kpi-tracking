server:
  port: 8081
  forward-headers-strategy: framework
  # Mặc định của Boot đã là never/never; ghi rõ để ai đổi profile cũng không vô tình bật.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: keygo

  datasource:
    url: ${DB_URL:jdbc:postgresql://kpitracking-db:5432/kpitracking}
    username: ${DB_USERNAME:postgres}
    # Không có default: prod thiếu DB_PASSWORD thì phải dừng ngay, không được âm thầm dùng mật khẩu dev.
    password: ${DB_PASSWORD}
    hikari:
      # Moi instance backend giu toi da N ket noi. Postgres compose mac dinh max_connections=100
      # -> toi da 4 instance voi 20. Dat theo vCPU cua Postgres (~ 2 x core), xem
      # docs/DATABASE_SCALING.md H6. Bien moi truong de chinh khong can build lai.
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      # validate: Hibernate chi kiem tra entity khop schema, KHONG tao bang/cot nua (nguon goc drift
      # prod, docs/DATABASE_SCALING.md C1). Bat sau khi V8__reconcile_prod da chay tren prod.
      # Neu boot loi vi lech schema chua luong truoc: dat JPA_DDL_AUTO=update tren Coolify de len
      # tam, roi viet V{n} sua schema.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Gom cac lan nap quan he LAZY thanh truy van IN theo lo.
        # Khong co no, mot request /org-unit-kpi/detailed voi ~200 KPI se cham getSubmissions(),
        # getAssignees(), getOrgUnit(), getKpiPeriod() cho TUNG KPI -> hang tram vong di ve DB.
        # (application.yaml mac dinh cung dat 100 + jdbc.batch_size; giu o day de prod ro rang.)
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    # true = Flyway từ chối clean() dù code có gọi. Prod không bao giờ được tự xoá dữ liệu.
    clean-disabled: true
    postgresql:
      # Session-level advisory lock de CREATE INDEX CONCURRENTLY trong migration khong bi chan.
      transactional-lock: false
    # History prod con dong version 3..7 cua cac file da gop vao V1/V2 -> bo qua, migration moi tu V8.
    ignore-migration-patterns: "*:missing"
    placeholders:
      # false -> V4 vô hiệu hoá 31 tài khoản seed (admin@keygo.vn, *@demo.com) còn dùng mật khẩu
      # mặc định ghi công khai trong V2__seed_data.sql. Xem docs/SECURITY_AUDIT.md C3.
      seedAccountsEnabled: ${SEED_ACCOUNTS_ENABLED:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      # 5 tệp x 10MB = 50MB chẵn, không chừa chỗ cho phần bao multipart nên lô đầy sẽ trượt.
      max-request-size: 55MB

  ai:
    google:
      genai:
        api-key: ${gemini.api.key}
        chat:
          options:
            model: ${gemini.api.model}
            temperature: 0.0
            include-thoughts: false
      retry:
        max-attempts: 1
        on-http-codes-to-retry:
    openai:
      api-key: ${huggingface.api.key:your-hf-key}
      base-url: ${huggingface.api.url:https://router.huggingface.co}

      chat:
        options:
          # Hau to sau dau ':' la nha cung cap chay model (cerebras / groq / deepinfra) —
          # doi model la doi ca noi phuc vu. 120b:cerebras la bo da do o dev; 20b:groq la bo cu,
          # re hon nhung chon tool kem hon o cau nhieu buoc.
          model: ${huggingface.api.model:openai/gpt-oss-120b:cerebras}
          temperature: 0
          # gpt-oss là reasoning model: nếu trần output thấp (mặc định ~2048) thì reasoning
          # ăn hết token -> finishReason=LENGTH, trả text rỗng. Nới trần cho đủ reasoning + output.
          max-tokens: ${AI_MAX_TOKENS:8192}
          # Mức suy luận gpt-oss: 'high' (mặc định) reasoning quá nhiều -> chậm + dễ chạm LENGTH;
          # 'low' dễ chọn sai tool trên model 20B. 'medium' cân bằng cho tool-use nhiều bước.
          reasoning-effort: ${AI_REASONING_EFFORT:medium}
    retry:
      max-attempts: 2
      on-http-codes-to-retry:

jwt:
  # Không có default: khoá ký token mà rơi về giá trị commit trong git thì ai đọc repo cũng
  # tự phát hành được phiên đăng nhập. Thiếu JWT_SECRET → ứng dụng không khởi động.
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:9000000}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000}

lark:
  # App ID / App Secret KHÔNG nằm ở đây: mỗi công ty tự cấu hình trong tab "Kết nối Lark"
  # và được lưu (đã mã hoá) trên bảng organizations.
  redirect-uri: ${LARK_REDIRECT_URI:https://keygo.vn/auth/lark/callback}
  # Feishu (bản Trung Quốc) dùng open.feishu.cn / accounts.feishu.cn
  open-base-url: ${LARK_OPEN_BASE_URL:https://open.larksuite.com}
  auth-base-url: ${LARK_AUTH_BASE_URL:https://accounts.larksuite.com}

sepay:
  # Khoá gửi kèm header "Authorization: Apikey <key>" của webhook SePay.
  # ⚠️ ĐỂ TRỐNG Ở PROD LÀ TẮT TÍNH NĂNG NẠP TIỀN: mọi webhook bị chặn, tiền vào tài khoản
  #    nhưng ví KeyGo không được cộng. Để trống là có chủ đích — thà không cộng còn hơn
  #    để người lạ cộng tiền bằng request ẩn danh.
  webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
  # Danh sách IP được phép gọi webhook, phân tách bằng dấu phẩy. Để trống là tắt
  # lớp kiểm tra này. Chỉ bật khi SePay công bố dải IP cố định: họ đổi IP mà cấu
  # hình chưa cập nhật thì toàn bộ giao dịch nạp chết lặng.
  webhook-allowed-ips: ${SEPAY_WEBHOOK_ALLOWED_IPS:}

urbox:
  # Kho quà eVoucher UrBox. TẮT mặc định ở prod: bật mà chưa có credential PROD thì mọi
  # đơn đổi quà sẽ hỏng ngay trước mặt nhân viên.
  enabled: ${URBOX_ENABLED:false}
  # ⚠️ URL PROD do UrBox cấp sau khi nghiệm thu kết nối. Để nguyên sandbox mà bật enabled
  # là nhân viên đổi được mã KHÔNG dùng được ở cửa hàng nào.
  base-url: ${URBOX_BASE_URL:https://sandapi.urbox.dev}
  app-id: ${URBOX_APP_ID:}
  app-secret: ${URBOX_APP_SECRET:}
  campaign-code: ${URBOX_CAMPAIGN_CODE:}
  # ⚠️ BẮT BUỘC ở PROD: UrBox xác thực chữ ký đơn bằng public key đối tác đã gửi lên.
  # Private key PKCS#8, giữ nguyên xuống dòng của PEM.
  private-key: ${URBOX_PRIVATE_KEY:}
  send-sms: ${URBOX_SEND_SMS:false}
  read-timeout: ${URBOX_READ_TIMEOUT:60s}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}

app:
  ai:
    # Sáu công tắc của chuỗi công đoạn AI. MẶC ĐỊNH TRONG MÃ NGUỒN CỦA BỐN CÁI ĐẦU LÀ
    # false — không khai báo ở đây là production chạy THIẾU router / planning / validation /
    # streaming dù mã đã có đủ. Khối này để prod bật đúng bộ đã đo ở dev.
    # Lý do từng cái, kèm số đo và lịch sử bật/tắt: xem application.yaml.
    tool-routing:
      # Phân loại câu hỏi rồi chỉ gửi nhóm tool liên quan. Không chắc thì lùi về toàn bộ nhóm đọc.
      enabled: ${AI_TOOL_ROUTING_ENABLED:true}
    planning:
      # Chia câu hỏi thành các bước con để model không dừng sau bước đầu.
      enabled: ${AI_PLANNING_ENABLED:true}
      # Đối chiếu tool đã lên kế hoạch với tool thực sự chạy, thiếu thì hỏi lại ĐÚNG một lần.
      # Chỉ có tác dụng khi planning.enabled=true.
      enforce: ${AI_PLANNING_ENFORCE:true}
    followups:
      # Câu hỏi gợi ý sau mỗi câu trả lời. Tắt đi là MẤT tính năng, không phải "về trạng thái cũ".
      enabled: ${AI_FOLLOWUPS_ENABLED:true}
    validation:
      # CHẶN câu trả lời đưa ra số liệu mà lượt đó không tool nào chạy thành công.
      # Đây là cơ chế CHẶN: tắt đi thì model bịa số sẽ đến được người dùng.
      enabled: ${AI_VALIDATION_ENABLED:true}
    streaming:
      # Phát chữ gõ dần qua SSE thay vì chờ trọn câu trả lời.
      # ⚠️ Bật cờ này là tắt parallel_tool_calls (TurnPromptBuilder) — bắt buộc, vì bộ ghép
      #    stream của Spring AI không gộp nổi nhiều tool call song song.
      enabled: ${AI_STREAMING_ENABLED:true}
  security:
    # Khoá mã hoá App Secret Lark và tenant_key trong database.
    # ⚠️ BẮT BUỘC ở production: thiếu hoặc ngắn dưới 32 ký tự thì ứng dụng KHÔNG khởi động
    #    (xem DataProtection.init) — cố tình như vậy để không bao giờ chạy bằng khoá suy ra được.
    # ⚠️ ĐỔI KHOÁ NÀY = MẤT LIÊN KẾT Lark của mọi công ty, không phục hồi được.
    # Sinh khoá: openssl rand -base64 48
    data-key: ${DATA_ENCRYPTION_KEY:}
  cors:
    # ⚠️ KHÔNG dùng '*': phiên đăng nhập đi bằng cookie nên allowCredentials=true, một wildcard
    # ở đây đồng nghĩa mọi website đều gọi được API thay mặt người dùng đang đăng nhập.
    # Ứng dụng từ chối khởi động nếu giá trị là '*'.
    allowed-origins: ${CORS_ORIGINS:https://keygo.vn}
  cookie:
    # Cookie chứa access token / refresh token — prod luôn phải Secure (chỉ gửi qua HTTPS).
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
    # BẮT BUỘC có giá trị ở prod: SPA chạy ở keygo.vn còn API ở api.keygo.vn.
    # Để trống = cookie host-only, mỗi host tự giữ một bản kg_csrf riêng -> JS bên keygo.vn
    # đọc được token của keygo.vn rồi gửi sang api.keygo.vn, nơi cookie mang giá trị khác
    # => CsrfFilter chặn mọi POST/PUT/PATCH/DELETE. Đặt domain gốc để hai host dùng chung
    # đúng một cookie.
    domain: ${COOKIE_DOMAIN:keygo.vn}
  flyway:
    # Prod khong bao gio clean. Validate loi (V1/V2 doi checksum sau khi dong bang) -> repair() roi
    # migrate tiep. Xem FlywayConfig.
    on-validation-error: repair
  cache:
    authorities:
      # Cache quyen theo user (Caffeine, in-process) trong CustomUserDetailsService. 0 = tat.
      # Quyen bi go con hieu luc toi da TTL tren instance KHAC. docs/DATABASE_SCALING.md C2.
      ttl-seconds: ${AUTHORITY_CACHE_TTL_SECONDS:30}
      max-entries: ${AUTHORITY_CACHE_MAX_ENTRIES:50000}
  retention:
    # Job don du lieu ghi lien tuc (DataRetentionScheduler). MAC DINH TAT — bat sau khi da chay
    # backend/db/ops/002 + 003 tren prod va xac nhan TTL voi nghiep vu. docs/DATABASE_SCALING.md C3.
    enabled: ${APP_RETENTION_ENABLED:false}
    batch-size: ${APP_RETENTION_BATCH_SIZE:5000}
    max-batches-per-run: ${APP_RETENTION_MAX_BATCHES:200}
    refresh-tokens:
      expired-days: ${APP_RETENTION_REFRESH_EXPIRED_DAYS:1}
      revoked-days: ${APP_RETENTION_REFRESH_REVOKED_DAYS:7}
    notifications:
      read-days: ${APP_RETENTION_NOTIF_READ_DAYS:90}
      unread-days: ${APP_RETENTION_NOTIF_UNREAD_DAYS:180}
    security-audit-logs:
      days: ${APP_RETENTION_AUDIT_DAYS:180}
  rate-limit:
    # Giới hạn tần suất các endpoint xác thực (AuthRateLimitFilter) + khoá tài khoản sau nhiều
    # lần sai (LoginAttemptService). Số là request/IP/cửa sổ; đếm trong bộ nhớ từng instance.
    enabled: ${RATE_LIMIT_ENABLED:true}
    # CHỈ bật khi backend đứng sau nginx/reverse proxy — client gọi thẳng mà bật thì tự đặt
    # được X-Forwarded-For để né giới hạn.
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_PROXY:true}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    login: ${RATE_LIMIT_LOGIN:20}
    register: ${RATE_LIMIT_REGISTER:5}
    forgot-password: ${RATE_LIMIT_FORGOT:5}
    reset-password: ${RATE_LIMIT_RESET:10}
    verify-email: ${RATE_LIMIT_VERIFY:20}
    resend-verification: ${RATE_LIMIT_RESEND:5}
    refresh-token: ${RATE_LIMIT_REFRESH:60}
    change-password: ${RATE_LIMIT_CHANGE_PASSWORD:10}
    lark: ${RATE_LIMIT_LARK:30}
    max-failed-logins: ${LOGIN_MAX_FAILED:10}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    email-per-hour: ${RATE_LIMIT_EMAIL:3}
    ai-per-minute: ${RATE_LIMIT_AI_MIN:15}
    ai-per-day: ${RATE_LIMIT_AI_DAY:200}
  mail:
    from: ${MAIL_FROM:noreply@keygo.com}
  landing:
    # Email nhận thông báo khi có người điền form "Đăng ký tư vấn" ở trang giới thiệu.
    # Để trống thì chỉ lưu vào bảng landing_leads, không gửi mail.
    notify-email: ${LANDING_NOTIFY_EMAIL:}
  notification:
    # Gom email thông báo theo người nhận. Cùng ý nghĩa với khối trong application.yaml,
    # nhắc lại ở đây để người vận hành thấy được các núm điều chỉnh của production.
    digest:
      enabled: ${NOTIFICATION_DIGEST_ENABLED:true}
      quiet-period: ${NOTIFICATION_DIGEST_QUIET_PERIOD:PT3M}
      max-delay: ${NOTIFICATION_DIGEST_MAX_DELAY:PT20M}
      scan-interval: ${NOTIFICATION_DIGEST_SCAN_INTERVAL:PT1M}
      retention: ${NOTIFICATION_DIGEST_RETENTION:P7D}

gemini:
  api:
    key: ${GEMINI_API_KEY:your-gemini-key}
    model: ${GEMINI_MODEL:gemini-3-flash-preview}

claude:
  api:
    key: ${CLAUDE_API_KEY:your-claude-key}
    model: ${CLAUDE_MODEL:claude-3-5-sonnet-20241022}

springdoc:
  # Tắt ở prod: OpenAPI liệt kê toàn bộ endpoint + schema cho người ngoài. Bật tạm bằng
  # SWAGGER_ENABLED=true khi cần và tắt lại ngay.
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: info
    # DEBUG của Spring Security in header, principal và chuỗi filter cho MỌI request —
    # quá nhiều dữ liệu nhạy cảm cho log prod. Nới tạm bằng LOG_LEVEL_APP/LOG_LEVEL_SECURITY.
    com.kpitracking: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    # Ghi đè CỨNG các mức mà application.yaml (profile mặc định, luôn được nạp dưới file này) đặt DEBUG:
    # SimpleLoggerAdvisor ở DEBUG in NGUYÊN VĂN prompt + câu trả lời AI (tên KPI, tên nhân viên, số liệu)
    # qua "request: {}" / "response: {}". Không có env để nới — muốn soi thì soi ở local.
    org.springframework.ai: INFO
    org.springframework.ai.chat.client.advisor: INFO
    # Không in SQL / tham số bind ra log prod (chứa dữ liệu bảng).
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never