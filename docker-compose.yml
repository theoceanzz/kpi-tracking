version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`keygo.vn`)"
      - "traefik.http.routers.frontend.entrypoints=https"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod

      # Database
      - DB_URL=jdbc:postgresql://kpitracking-db:5432/kpitracking
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-123456}

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-9000000}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-604800000}

      # App
      # ⚠️ Không được để '*': phiên đăng nhập đi bằng cookie HttpOnly nên CORS chạy với
      # allowCredentials=true — wildcard đồng nghĩa mọi website gọi được API thay mặt
      # người dùng đang đăng nhập. Backend từ chối khởi động nếu gặp '*'.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://keygo.vn}
      # Cookie xác thực chỉ được gửi qua HTTPS ở production.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - APP_FRONTEND_URL=${FRONTEND_URL:-https://keygo.vn}

      # Lark SSO. App ID/Secret của từng công ty lưu trong DB, không cấu hình ở đây.
      - LARK_REDIRECT_URI=${LARK_REDIRECT_URI:-https://keygo.vn/auth/lark/callback}

      # Khoá mã hoá dữ liệu nhạy cảm trong DB (App Secret Lark, tenant_key).
      # Cú pháp :? khiến compose dừng ngay nếu biến chưa khai — biến rỗng sẽ làm khoá suy ra được.
      # ĐỔI KHOÁ = MẤT LIÊN KẾT Lark của mọi công ty, không phục hồi được.
      # Sinh khoá bằng lệnh: openssl rand -base64 48
      # Lưu ý: phải bọc nháy kép, nếu không dấu ':' trong thông báo sẽ khiến YAML hiểu nhầm là map.
      - "DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?chua khai DATA_ENCRYPTION_KEY trong .env - xem huong dan phia tren}"

      # Cloudinary
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

      # Mail
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}

      # AI
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL}

      # Kho quà eVoucher UrBox. Credential dùng chung cho cả nền tảng (KeyGo là đối tác
      # ký hợp đồng), phân biệt tổ chức nào đổi quà bằng site_user_id gửi kèm mỗi đơn.
      # Bật enabled mà để nguyên base-url sandbox = nhân viên nhận mã không dùng được.
      - URBOX_ENABLED=${URBOX_ENABLED:-false}
      - URBOX_BASE_URL=${URBOX_BASE_URL:-https://sandapi.urbox.dev}
      - URBOX_APP_ID=${URBOX_APP_ID:-}
      - URBOX_APP_SECRET=${URBOX_APP_SECRET:-}
      - URBOX_CAMPAIGN_CODE=${URBOX_CAMPAIGN_CODE:-}
      # PROD bắt buộc: UrBox xác thực chữ ký đơn bằng public key đối tác đã gửi lên.
      - URBOX_PRIVATE_KEY=${URBOX_PRIVATE_KEY:-}

      # Rate limit
      - RATE_LIMIT_LOGIN=${RATE_LIMIT_LOGIN:-5}
      - RATE_LIMIT_EMAIL=${RATE_LIMIT_EMAIL:-3}

    depends_on:
      kpitracking-db:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app-network
      - coolify

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=(Host(`keygo.vn`) && PathPrefix(`/api`))"
      - "traefik.http.routers.backend.entrypoints=https"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"
      - "traefik.docker.network=coolify"

  kpitracking-db:
    image: postgres:15-alpine

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: kpitracking
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d kpitracking"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

  coolify:
    external: true

volumes:
  postgres_data: